<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tally — tests</title>
  <link rel="icon" href="./favicon.svg" />
  <link rel="stylesheet" href="./styles.css?v=1" />
  <style>
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
    .verdict { font-size: 20px; font-weight: 650; margin: 0 0 4px; }
    .verdict.pass { color: var(--income); }
    .verdict.fail { color: var(--expense); }
    ol { list-style: none; padding: 0; margin: 20px 0 0; }
    li { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 14px;
         display: grid; grid-template-columns: 20px 1fr; gap: 10px; }
    li .mark { font-weight: 700; }
    li.ok .mark { color: var(--income); }
    li.bad .mark { color: var(--expense); }
    li .why { grid-column: 2; color: var(--expense); font-family: var(--font-num);
              font-size: 12.5px; margin-top: 4px; }
  </style>
</head>
<body>
  <main>
    <h1 style="font-size:22px;margin-bottom:6px">Tally — tests</h1>
    <p class="help" style="margin-top:0">
      Everything in <code>money.js</code>, checked in the browser it will actually run in.
      The same file runs in a terminal with <code>node tools/run-tests.mjs</code>.
    </p>
    <p class="verdict" id="verdict">Running…</p>
    <p class="help" id="detail"></p>
    <ol id="list"></ol>
  </main>

  <script type="module">
    import { runTests } from "./tests.js?v=1";

    const { results, passed, failed } = await runTests();
    const verdict = document.getElementById("verdict");
    verdict.textContent = failed ? failed + " failing" : "All " + passed + " passing";
    verdict.className = "verdict " + (failed ? "fail" : "pass");
    document.getElementById("detail").textContent =
      passed + " passed, " + failed + " failed, " + results.length + " total";

    const list = document.getElementById("list");
    for (const r of results) {
      const li = document.createElement("li");
      li.className = r.ok ? "ok" : "bad";
      const mark = document.createElement("span");
      mark.className = "mark";
      mark.textContent = r.ok ? "✓" : "✕";
      const name = document.createElement("span");
      name.textContent = r.name;
      li.append(mark, name);
      if (!r.ok) {
        const why = document.createElement("span");
        why.className = "why";
        why.textContent = r.error;
        li.append(why);
      }
      list.append(li);
    }
    // So a headless run can read the verdict without parsing the page.
    document.title = failed ? "FAIL " + failed : "PASS " + passed;
  </script>
</body>
</html>
