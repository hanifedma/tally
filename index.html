<!doctype html>
<!-- "preload" disables transitions until the first paint, so nothing animates
     as the page loads; app.js removes it once rendering has settled. -->
<html lang="en" class="preload">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0f0f10" />
  <!-- Bumped on every deploy by bump-version.sh. The app polls version.json
       and offers a reload when this no longer matches. -->
  <meta name="app-version" content="14" />

  <title>Tally — Money manager · 가계부</title>
  <meta name="description" content="Tally is a fast, private money manager. Track every account and every currency in one ledger, with Google sign-in, real-time sync across your phone and laptop, and budgets that follow your payday. 원과 루피아를 한 장부에. 구글 로그인, 모든 기기 실시간 동기화." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://hanifedma.com/tally/" />
  <link rel="alternate" hreflang="en" href="https://hanifedma.com/tally/" />
  <link rel="alternate" hreflang="ko" href="https://hanifedma.com/tally/" />
  <link rel="alternate" hreflang="x-default" href="https://hanifedma.com/tally/" />

  <!-- Icons / installable PWA -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./site.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tally" />
  <meta name="application-name" content="Tally" />

  <!-- Open Graph / Twitter — rich link previews -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Tally" />
  <meta property="og:title" content="Tally — Money manager · 가계부" />
  <meta property="og:description" content="Every account and every currency in one ledger. Real-time on your phone and your laptop, and budgets that follow your payday." />
  <meta property="og:url" content="https://hanifedma.com/tally/" />
  <meta property="og:image" content="https://hanifedma.com/tally/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="ko_KR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Tally — Money manager · 가계부" />
  <meta name="twitter:description" content="Every account and every currency in one ledger, in real time on every device." />
  <meta name="twitter:image" content="https://hanifedma.com/tally/og-image.png" />

  <!-- Tell the browser early about the two origins the app must reach, so the
       TCP + TLS handshakes overlap with parsing instead of following it. Worth
       real time on a slow connection. -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://accounts.google.com" crossorigin />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Tally",
    "url": "https://hanifedma.com/tally/",
    "applicationCategory": "FinanceApplication",
    "operatingSystem": "Any",
    "browserRequirements": "Requires JavaScript",
    "inLanguage": ["en", "ko"],
    "description": "A fast, private money manager. Track every account and every currency in one ledger, sync in real time across devices with Google sign-in, and budget by your own month.",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "featureList": [
      "Expenses, income and transfers",
      "Multiple accounts and currencies in one total",
      "Monthly budgets, total and per category",
      "Real-time sync across devices",
      "Works offline",
      "CSV export",
      "English and Korean"
    ]
  }
  </script>

  <!-- Bump ?v= every deploy so browsers fetch fresh CSS and JS. -->
  <link rel="stylesheet" href="./styles.css?v=14" />

  <!-- Set the theme and language before the first paint, so there is never a
       flash of the wrong colours or the wrong words. Defaults: dark, English.
       These are the device's last-known values; once signed in, the account's
       own settings take over. -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("tally.theme");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "light" ? "#fbfbfd" : "#0f0f10");
        var l = localStorage.getItem("tally.lang");
        if (l === "ko") document.documentElement.setAttribute("lang", "ko");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>

  <noscript>
    <div class="noscript-note">
      <h1>Tally needs JavaScript</h1>
      <p>Please enable JavaScript in your browser to use this app.</p>
      <p>이 앱을 사용하려면 브라우저에서 JavaScript를 켜 주세요.</p>
    </div>
  </noscript>

  <!-- Shown until boot decides which view to render, so the screen is never
       blank while the session is restored. -->
  <div id="boot" class="boot" aria-hidden="true">
    <img class="boot-mark" src="./favicon.svg" alt="" width="56" height="56" />
  </div>

  <!-- The loading screen's last resort. app.js has its own timeout, but it can
       only run if app.js itself loaded — and when a cached page is left holding
       a script that will not load, nothing on the page is in a position to
       notice. This watchdog is: a plain inline script, no imports, nothing of
       its own to download. -->
  <script>
    window.__tallyBootWatchdog = setTimeout(function () {
      var boot = document.getElementById("boot");
      if (!boot || boot.classList.contains("hidden")) return;
      boot.innerHTML =
        '<div style="text-align:center;padding:24px;max-width:340px">' +
        '<p style="font-size:15px;margin:0 0 6px">Tally could not finish loading.</p>' +
        '<p style="font-size:13px;opacity:.7;margin:0 0 18px">' +
        'Check your connection, then try again. · 연결을 확인한 뒤 다시 시도하세요.</p>' +
        '<button style="padding:10px 20px;border-radius:11px;border:0;cursor:pointer;' +
        'background:#8b93ff;color:#12122a;font:inherit;font-weight:600" ' +
        'onclick="location.reload()">Reload</button></div>';
    }, 12000);
  </script>

  <!-- ============================================================
       Setup — shown only when supabase-config.js is still a placeholder.
       ============================================================ -->
  <section id="setup" class="setup hidden" hidden>
    <img src="./favicon.svg" alt="" width="56" height="56" style="border-radius:16px" />
    <h1 id="setupTitle" style="margin:16px 0 10px;font-size:21px"></h1>
    <p id="setupP1" style="color:var(--muted)"></p>
    <p id="setupP2" style="color:var(--muted)"></p>
    <ul id="setupList"></ul>
    <!-- Nothing above needs doing to use Tally on this device alone. -->
    <button class="btn btn-primary" id="setupLocal" type="button" style="margin-top:18px"></button>
    <p class="help" id="setupLocalHelp" style="margin-top:10px"></p>
  </section>

  <!-- ============================================================
       Sign in
       ============================================================ -->
  <section id="login" class="login hidden" hidden>
    <div class="login-inner">
      <img class="login-mark" src="./favicon.svg" alt="Tally" width="68" height="68" />
      <h1 id="loginH1"></h1>
      <p class="login-sub" id="loginSub"></p>

      <div class="login-btn-slot" id="googleSlot"></div>
      <button class="btn btn-primary btn-block hidden" id="loginFallback" hidden></button>
      <p class="help" id="loginWait" style="text-align:center"></p>
      <p class="error hidden" id="loginError" hidden style="text-align:center"></p>

      <!-- Signing in is the better way to use Tally, not the only one. -->
      <div class="login-or"><span id="loginOr"></span></div>
      <button class="btn btn-ghost btn-block" id="loginLocal" type="button"></button>
      <p class="help" id="loginLocalSub" style="text-align:center;margin-top:8px"></p>

      <!-- Theme and language, and nothing else. The three feature blurbs
           that used to sit here were an advertisement on a screen reached
           by people who have already decided. -->
      <div style="margin-top:26px;display:flex;gap:10px;justify-content:center">
        <button class="icon-btn" id="loginTheme" type="button"></button>
        <button class="icon-btn" id="loginLang" type="button" style="width:auto;padding:0 10px;font-size:12.5px;font-weight:600"></button>
      </div>
    </div>
  </section>

  <!-- ============================================================
       The app
       ============================================================ -->
  <div id="app" class="app hidden" hidden>
    <header class="header">
      <div class="header-row">
        <span class="brand"><img src="./favicon.svg" alt="" width="22" height="22" />Tally</span>
        <span id="syncStatus" class="status hidden" hidden><i></i><span></span></span>
        <span class="spacer"></span>
        <button class="icon-btn" id="btnSearch" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <button class="icon-btn" id="btnTheme" type="button"></button>
        <button class="icon-btn" id="btnLang" type="button" style="width:auto;padding:0 9px;font-size:12px;font-weight:650"></button>
        <button class="icon-btn" id="btnMenu" type="button" style="width:34px">
          <img class="avatar hidden" id="avatar" alt="" hidden />
          <svg id="menuIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9.8" r="3"/><path d="M5.8 19.2a6.6 6.6 0 0 1 12.4 0"/></svg>
        </button>
      </div>

      <nav class="period" id="periodNav">
        <button class="icon-btn" id="btnPrev" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
        </button>
        <button class="period-label" id="periodLabel" type="button"></button>
        <button class="icon-btn" id="btnNext" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 5 7 7-7 7"/></svg>
        </button>
      </nav>

      <div class="search-bar hidden" id="searchBar" hidden>
        <input class="input" id="searchInput" type="search" autocomplete="off" />
        <button class="icon-btn" id="btnSearchClose" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>

      <dl class="summary" id="summary">
        <div><dt id="sumInLabel"></dt><dd class="v-income num" id="sumIn">—</dd></div>
        <div><dt id="sumOutLabel"></dt><dd class="v-expense num" id="sumOut">—</dd></div>
        <div><dt id="sumNetLabel"></dt><dd class="v-net num" id="sumNet">—</dd></div>
      </dl>

      <div class="tabs">
        <div class="tabs-inner" role="tablist">
          <button class="tab" role="tab" id="tabLog" data-view="log" aria-selected="true"></button>
          <button class="tab" role="tab" id="tabInsights" data-view="insights" aria-selected="false"></button>
          <button class="tab" role="tab" id="tabAccounts" data-view="accounts" aria-selected="false"></button>
        </div>
      </div>
    </header>

    <main class="main" id="main">
      <div id="banner" class="banner hidden" hidden></div>
      <section id="viewLog" role="tabpanel" aria-labelledby="tabLog"></section>
      <section id="viewInsights" role="tabpanel" aria-labelledby="tabInsights" class="hidden" hidden></section>
      <section id="viewAccounts" role="tabpanel" aria-labelledby="tabAccounts" class="hidden" hidden></section>
    </main>

    <button class="fab" id="fab" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- Sheets are <dialog> elements created as they are needed and removed
       when they close — see openSheet() in app.js. Nothing static here. -->

  <!-- popover="manual" so this can be promoted into the top layer, above an
       open sheet, without a backdrop and without light dismiss. See
       raiseToasts() in app.js. -->
  <div class="toast-wrap" id="toasts" popover="manual" role="status" aria-live="polite"></div>

  <script type="module" src="./app.js?v=14"></script>
</body>
</html>
